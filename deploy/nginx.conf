# nginx site for the FTMO Risk Calculator (static PWA).
# Install: copy to /etc/nginx/sites-available/ftmo-calculator, replace calc.example.com and root,
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS is REQUIRED for PWA install/offline: sudo certbot --nginx -d calc.example.com

server {
    listen 80;
    listen [::]:80;
    server_name calc.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name calc.example.com;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/calc.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/calc.example.com/privkey.pem;

    root /var/www/ftmo-calculator;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'; manifest-src 'self'" always;

    types { application/manifest+json webmanifest; font/woff2 woff2; }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Service worker + HTML must always revalidate so updates reach users.
    location = /sw.js         { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /index.html    { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }

    # Other assets: short cache; the service worker handles offline.
    location ~* \.(js|css|woff2|png|svg)$ { add_header Cache-Control "public, max-age=3600" always; add_header X-Content-Type-Options nosniff always; }

    location / { try_files $uri $uri/ /index.html; }
}
